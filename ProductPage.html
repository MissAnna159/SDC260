<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page - Fresh Caption</title>
    <link rel="stylesheet" href="StyleSheet.css">
</head>
<body>
<header>
    <h1>Product Details</h1>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="ProductPage.html">Products</a></li>
            <li><a href="ShopPage.html">Shop</a></li>
            <li><a href="CartPage.html">Cart</a></li>
            <li><a href="ContactPage.html">Contact</a></li>
            <li><a href="NetworkTest.html">Network Test</a></li>
        </ul>
    </nav>
</header>

<div id="product-details-container">
    <!-- Product detail blocks generated by JavaScript from the products array -->
</div>

<footer>
    <p>Fresh Caption</p>
</footer>

<script src="script.js"></script>
<script>
    function renderProductDetails() {
        const container = document.getElementById("product-details-container");
        if (!container) return;
        container.innerHTML = "";

        for (let i = 0; i < products.length; i++) {
            const p = products[i];
            const outOfStock = p.stock <= 0;
            const buttonHtml = outOfStock
                ? `<button class="out-of-stock" disabled title="Out of Stock">Out of Stock</button>`
                : `<button class="add-cart" onclick="addToCart(${p.id})" title="Add to cart">Add to Cart</button>`;

            const main = document.createElement("main");
            main.className = "product-container";
            main.innerHTML = `
                <section class="product-details">
                    <img src="${p.image}" alt="${p.name}">
                    <h2>${p.name} Tee</h2>
                    <p class="price">$${p.price.toFixed(2)}</p>
                    <p>In stock: ${p.stock}</p>
                    <h3>Color</h3>
                    <div class="color-options">
                        <button>Black</button>
                        <button>White</button>
                    </div>
                    <h3>Select Size</h3>
                    <div class="size-options">
                        <button>S</button>
                        <button>M</button>
                        <button>L</button>
                        <button>XL</button>
                    </div>
                    <label for="quantity-${p.id}">Quantity</label>
                    <input type="number" id="quantity-${p.id}" min="1" value="1">
                    ${buttonHtml}
                    <section class="description">
                        <h3>Product Details</h3>
                        <p>${p.description}</p>
                    </section>
                </section>
            `;
            container.appendChild(main);
        }
    }

    document.addEventListener("DOMContentLoaded", renderProductDetails);
</script>
</body>
</html>
