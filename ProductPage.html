<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page - Fresh Caption</title>
    <link rel="stylesheet" href="StyleSheet.css">
</head>

<div id="product-details-container">
    <!-- Product detail blocks generated by JavaScript from the products array -->
</div>

<footer> 

    <p>Fresh Caption</p> 

</footer> 

<script src="script.js"></script>
<script>
    // Render product detail sections using the products array
    function renderProductDetails() {
        const container = document.getElementById("product-details-container");
        if (!container) return;
        container.innerHTML = "";

        // JavaScript looping mechanism over the products array
        for (let i = 0; i < products.length; i++) {
            const p = products[i];
            const main = document.createElement("main");
            main.className = "product-container";
            main.innerHTML = `
                <section class="product-details">
                    <img src="${p.image}" alt="${p.name}">
                    <h2>${p.name} Tee</h2>
                    <p class="price">$${p.price.toFixed(2)}</p>
                    <h3>Color</h3>
                    <div class="color-options">
                        <button>Black</button>
                        <button>White</button>
                    </div>
                    <h3>Select Size</h3>
                    <div class="size-options">
                        <button>S</button>
                        <button>M</button>
                        <button>L</button>
                        <button>XL</button>
                    </div>
                    <label for="quantity-${p.id}">Quantity</label>
                    <input type="number" id="quantity-${p.id}" min="1" value="1">
                    <button class="add-cart" onclick="addToCart(${p.id})">
                        Add to Cart
                    </button>
                    <section class="description">
                        <h3>Product Details</h3>
                        <p>${p.description}</p>
                    </section>
                </section>
            `;
            container.appendChild(main);
        }
    }

    document.addEventListener("DOMContentLoaded", renderProductDetails);
</script>

</body>
