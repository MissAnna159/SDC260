<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Fresh Caption</title>
    <link rel="stylesheet" href="StyleSheet.css">
</head>
<body>
<header>
    <h1>Contact Fresh Caption</h1>
    <nav>
        <ul>
            <li><a href="HomePage.html">Home</a></li>
            <li><a href="ShopPage.html">Shop</a></li>
            <li><a href="CartPage.html">Cart</a></li>
            <li><a href="ContactPage.html">Contact</a></li>
        </ul>
    </nav>
</header>
<main>
    <section>
        <h2>Get in Touch</h2>
        <p>Have a question about an order, a design idea, or just want to say hi? Send us a message!</p>
        <form id="contact-form" onsubmit="submitContact(event)">
            <label for="contact-name">Full Name</label>
            <input type="text" id="contact-name" name="name" placeholder="Your full name">

            <label for="contact-email">Email Address <span style="color:red">*</span></label>
            <input type="email" id="contact-email" name="email" required placeholder="you@example.com">

            <label for="contact-subject">Subject</label>
            <input type="text" id="contact-subject" name="subject" placeholder="What's this about?">

            <label for="contact-message">Message <span style="color:red">*</span></label>
            <textarea id="contact-message" name="message" rows="5" required placeholder="Your message..."></textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>
</main>
<footer>
    <p>&copy; 2026 Fresh Caption</p>
</footer>
<script src="script.js"></script>
</body>
</html>
